name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: secure_notes_test
          POSTGRES_USER: secure_notes
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secure_notes -d secure_notes_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      PUBLIC_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://secure_notes:ci-only-database-password@127.0.0.1:5432/secure_notes_test
      DATABASE_SSL: disable
      SESSION_SECRETS: ci-only-session-secret-with-at-least-32-bytes
      TRUST_PROXY_HOPS: 0
      LOG_LEVEL: silent

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate database migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm run audit
