services:
  app:
    build: .
    command: ["node", "dist/scripts/start.js"]
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://secure_notes:local-development-only@database:5432/secure_notes
      DATABASE_SSL: disable
      SESSION_SECRETS: local-development-secret-replace-before-use-0123456789
      TRUST_PROXY_HOPS: 0
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secure_notes
      POSTGRES_USER: secure_notes
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - notes-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_notes -d secure_notes"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  notes-database:
